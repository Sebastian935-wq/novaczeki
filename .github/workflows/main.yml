name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      # Generuje gradlew + gradle-wrapper.jar (pliku binarnego nie ma w repo)
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.12

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: novaczeki-mod
          path: build/libs/*.jar
          if-no-files-found: error
